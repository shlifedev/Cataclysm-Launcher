name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.94.0-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.94.0-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  release:
    name: Publish prerelease
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.94.0-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.94.0-

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Verify tag is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"

          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            printf 'Tag %s (%s) is not reachable from origin/main.\n' "$GITHUB_REF_NAME" "$tag_commit" >&2
            exit 1
          fi

      - name: Build unsigned Universal 2 DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg --no-sign --ci -- --locked

      - name: Validate release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail

          dmg_dir='src-tauri/target/universal-apple-darwin/release/bundle/dmg'
          if [ ! -d "$dmg_dir" ]; then
            printf 'DMG output directory was not created: %s\n' "$dmg_dir" >&2
            exit 1
          fi

          shopt -s nullglob
          dmgs=( "$dmg_dir"/*.dmg )
          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf 'Expected exactly one DMG, found %s.\n' "${#dmgs[@]}" >&2
            find "$dmg_dir" -maxdepth 1 -type f -print >&2
            exit 1
          fi
          dmg_path="${dmgs[0]}"

          hdiutil verify "$dmg_path"

          mount_dir="$(mktemp -d)"
          mounted=0
          cleanup() {
            if [ "$mounted" -eq 1 ]; then
              hdiutil detach "$mount_dir" -quiet || hdiutil detach "$mount_dir" -force -quiet || true
            fi
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          mounted=1

          apps=( "$mount_dir"/*.app )
          if [ "${#apps[@]}" -ne 1 ]; then
            printf 'Expected exactly one app bundle in the DMG, found %s.\n' "${#apps[@]}" >&2
            find "$mount_dir" -maxdepth 2 -print >&2
            exit 1
          fi

          app_path="${apps[0]}"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          binary_path="$app_path/Contents/MacOS/$executable"
          if [ ! -f "$binary_path" ]; then
            printf 'App executable was not found: %s\n' "$binary_path" >&2
            exit 1
          fi

          architectures="$(lipo -archs "$binary_path")"
          for required_architecture in arm64 x86_64; do
            case " $architectures " in
              *" $required_architecture "*) ;;
              *)
                printf 'Expected %s architecture; found: %s\n' "$required_architecture" "$architectures" >&2
                exit 1
                ;;
            esac
          done

          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          dmg_name="$(basename "$dmg_path")"
          release_dmg="$release_dir/$dmg_name"
          cp "$dmg_path" "$release_dmg"
          (
            cd "$release_dir"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

          printf 'dmg_path=%s\n' "$release_dmg" >> "$GITHUB_OUTPUT"
          printf 'checksum_path=%s\n' "$release_dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "Cataclysm Hub $tag"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Cataclysm Hub $tag" \
              --prerelease \
              --generate-notes \
              --notes '⚠️ This testing prerelease is unsigned and not notarized. Verify the SHA-256 checksum before use.'
          fi

          gh release upload "$tag" \
            "${{ steps.release_assets.outputs.dmg_path }}" \
            "${{ steps.release_assets.outputs.checksum_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
