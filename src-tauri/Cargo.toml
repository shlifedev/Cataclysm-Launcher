[package]
name = "cataclysm-hub"
version = "0.1.0"
description = "A versioned launcher for Cataclysm DDA and BN"
authors = ["Cataclysm Hub contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
quick-xml = "0.37"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.0.0-pre3", default-features = false, features = ["deflate"] }
